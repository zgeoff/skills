name: Pull request

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # reports as `pr / checks`, the summary check name every zgeoff repo's main ruleset requires
  checks:
    name: pr
    uses: ./.github/workflows/checks.yml
