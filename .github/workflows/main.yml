name: Main

on:
  push:
    branches: [main]

# A cancelled run would leave its merged commit untested, so each commit gets a run of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  # zgeoff/tools pins the commit of this repo that repo-sync delivers. Each green main sends tools
  # its commit, and tools opens a pull request that moves the pin, whose merge syncs every repo.
  # The sync App's token for zgeoff/tools needs only its contents write to send the event.
  dispatch:
    name: Send the commit to zgeoff/tools
    needs: checks
    if: github.repository == 'zgeoff/skills'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # One send at a time, so the head that a send reads stays the newest commit tools gets.
    concurrency:
      group: ${{ github.workflow }}-dispatch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Mint the sync App token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.REPO_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.REPO_SYNC_APP_PRIVATE_KEY }}
          owner: zgeoff
          repositories: tools
          permission-contents: write

      - name: Send zgeoff-skills-sync to zgeoff/tools
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLS_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bun run --silent ci:send-sync
