name: Main

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes the checks of an older one worthless, and its dispatch carries the newer commit.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The whole run takes well under a minute, so a split into parallel jobs would save no wall time.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run check
      - run: bun run test

  # zgeoff/tools pins the commit of this repo that repo-sync delivers. Each green main sends tools
  # its commit, and tools opens a pull request that moves the pin, whose merge syncs every repo.
  # The sync App's token for zgeoff/tools needs only its contents write to send the event.
  dispatch:
    name: Send the commit to zgeoff/tools
    needs: checks
    if: github.event_name == 'push' && github.repository == 'zgeoff/skills'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mint the sync App token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.REPO_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.REPO_SYNC_APP_PRIVATE_KEY }}
          owner: zgeoff
          repositories: tools
          permission-contents: write

      - name: Send zgeoff-skills-sync to zgeoff/tools
        env:
          COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run:
          gh api --silent repos/zgeoff/tools/dispatches -f event_type=zgeoff-skills-sync -f
          "client_payload[sha]=$COMMIT"
